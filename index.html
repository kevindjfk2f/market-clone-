<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link
    rel="stylesheet"
    as="style"
    crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.6/dist/web/static/pretendard.css"
  />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Grid 스타일 추가 */
    main {
      display: grid;
      place-items: center; /* 수평 및 수직 가운데 정렬 */
      height: 100vh; /* 화면 전체 높이 */
    }

    /* 상단 글귀 스타일 */
    header {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.8); /* 약간의 배경색 */
      font-size: 1.5em;
      font-weight: bold;
      z-index: 1000;
      width: 100%;
    }

    /* 도움말 팝업 스타일 */
    .help-popup {
      display: none; /* 기본적으로 숨김 */
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: white;
      padding: 20px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      border-radius: 8px;
      width: 300px;
    }

    .help-popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .help-popup-header h2 {
      margin: 0;
      font-size: 1.2em;
    }

    .help-popup-close {
      cursor: pointer;
      font-size: 1.5em;
      line-height: 1;
      border: none;
      background: none;
    }

    .help-popup-content {
      margin-top: 10px;
      font-size: 0.9em;
      color: #333;
    }

    .help-button {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 10px;
      background-color: black;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1001;
    }
  </style>
</head>
<body>
  <header>마음의 책장</header>

  <main>
    <img src="KakaoTalk_20240818_143337611_02.png" alt="중앙에 위치한 이미지" />
  </main>

  <footer>
    <div class="footer-block">
      <div class="footer-icons">
        <div class="footer-icons__img">
          <img src="assets/home.svg" alt="" />
        </div>
        <div class="footer-icons__desc">만들기</div>
      </div>
      <div class="footer-icons">
        <div class="footer-icons__img">
          <img src="assets/doc.svg" alt="" />
        </div>
        <div class="footer-icons__desc">확인하기</div>
      </div>
      <div class="footer-icons">
        <div class="footer-icons__img">
          <img src="assets/location.svg" alt="" />
        </div>
        <div class="footer-icons__desc">공유하기</div>
      </div>
    </div>
  </footer>

  <div class="media-info-msg">화면 사이즈를 줄여주세요.</div>

  <!-- 도움말 팝업 -->
  <div class="help-popup" id="helpPopup">
    <div class="help-popup-header">
      <h2>도움말</h2>
      <button class="help-popup-close" id="closePopup">&times;</button>
    </div>
    <div class="help-popup-content">
      여기에 도움말 내용을 추가하세요. 이 팝업은 중요한 정보나 사용 지침을 표시할 때 유용합니다.
    </div>
  </div>

  <!-- 도움말 버튼 -->
  <button class="help-button" id="helpButton">?</button>

  <script>
    // 팝업 열기 및 닫기 기능
    const helpButton = document.getElementById('helpButton');
    const helpPopup = document.getElementById('helpPopup');
    const closePopup = document.getElementById('closePopup');

    helpButton.addEventListener('click', function() {
      helpPopup.style.display = 'block';
    });

    closePopup.addEventListener('click', function() {
      helpPopup.style.display = 'none';
    });

    // 팝업 외부 클릭 시 팝업 닫기
    window.addEventListener('click', function(event) {
      if (event.target === helpPopup) {
        helpPopup.style.display = 'none';
      }
    });
  </script>
</body>
</html>
